<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explorador de Clima - Aplicación web moderna para consultar el estado del tiempo en tiempo real.">
  <title>Explorador de Clima</title>
  
  <!-- Fuente de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-globes">
    <div class="globe globe-1"></div>
    <div class="globe globe-2"></div>
  </div>

  <main class="app-container">
    <!-- Encabezado de la aplicación -->
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-cloud-sun-rain"></i>
      </div>
      <h1>Explorador de Clima</h1>
      <p class="subtitle">Consulta el tiempo en tiempo real en cualquier ciudad del mundo</p>
    </header>

    <!-- Contenedor y Formulario de Búsqueda -->
    <section class="search-section">
      <form id="search-form" class="search-box">
        <div class="input-wrapper">
          <i class="fa-solid fa-location-dot search-icon"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Escribe una ciudad (ej. Madrid, Tokyo, Bogotá)..." 
            autocomplete="off"
            aria-label="Nombre de la ciudad"
          >
        </div>
        <button type="submit" id="search-btn" class="btn-primary">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Buscar</span>
        </button>
      </form>

      <!-- Contenedor para Mensajes de Validación -->
      <div id="validation-msg" class="validation-message hidden" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="validation-text">El campo no puede estar vacío</span>
      </div>
    </section>

    <!-- Contenedor del Estado de Carga -->
    <div id="loading-state" class="state-container hidden">
      <div class="spinner"></div>
      <p>Buscando información meteorológica...</p>
    </div>

    <!-- Contenedor del Estado de Error -->
    <div id="error-state" class="state-container error-card hidden" role="alert">
      <div class="error-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <p id="error-message">No se pudo encontrar la ciudad especificada.</p>
      <button id="retry-btn" class="btn-retry">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Reintentar</span>
      </button>
    </div>

    <!-- Contenedor Principal de Resultados del Clima -->
    <div id="weather-results" class="weather-results hidden">
      <!-- La tarjeta de clima se inyectará dinámicamente aquí -->
    </div>

    <!-- Sección de Historial de Búsquedas (Accesos rápidos) -->
    <section class="history-section">
      <h3>
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Historial de búsquedas</span>
      </h3>
      <div id="history-container" class="history-container">
        <!-- Las píldoras del historial se inyectarán dinámicamente aquí -->
      </div>
    </section>
  </main>

  <!-- Script principal -->
  <script src="app.js"></script>
</body>
</html>
